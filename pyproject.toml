[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-a2a-binary-wire-protocol"
version = "0.1.0"
description = "High-throughput binary framing and zero-copy packet parser for low-latency agent-to-agent communication"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-a2a-binary-wire-protocol = "agent_a2a_binary_wire_protocol.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_a2a_binary_wire_protocol*"]
